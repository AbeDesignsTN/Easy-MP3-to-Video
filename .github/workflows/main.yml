
name: Build Easy MP3 to Video

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build application and installer
        shell: pwsh
        run: ./Build.ps1

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: Easy-MP3-to-Video-Windows
          path: |
            Easy-MP3-to-Video.exe
            Easy-MP3-to-Video-Setup.exe
          if-no-files-found: error
